version: '3.8'

services:
  # ====================
  # Next.js Application
  # ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byd-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-prideauto2024}
      - DB_NAME=car_showroom
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - byd-network

  # ====================
  # MySQL Database
  # ====================
  db:
    image: mysql:8.0
    container_name: byd-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-prideauto2024}
      - MYSQL_DATABASE=car_showroom
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - byd-network

  # ====================
  # Nginx Reverse Proxy
  # ====================
  nginx:
    image: nginx:alpine
    container_name: byd-nginx
    restart: unless-stopped
    ports:
      # Map Host Port 8081 -> Container Port 80
      # (Change 8081 to any free port if needed)
      - "8081:80"
      # - "443:443" # Disable HTTPS on container, let the Main Server handle SSL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/app/public/uploads:ro
    depends_on:
      - app
    networks:
      - byd-network

# ====================
# Volumes
# ====================
volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local

# ====================
# Networks
# ====================
networks:
  byd-network:
    driver: bridge
